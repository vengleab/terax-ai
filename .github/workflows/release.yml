name: Release

# Run manually (Actions -> Release -> Run workflow) to tag the version in
# src-tauri/tauri.conf.json as v<version>, build macOS DMGs and publish them as
# a GitHub release. Pushing a v* tag yourself does the same for that tag.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        env:
          TRIGGER: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER" = "push" ]; then
            echo "tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ -n "$version" ] && [ "$version" != "null" ] \
            || { echo "no version in src-tauri/tauri.conf.json"; exit 1; }
          tag="v$version"

          # A re-run after a failed build reuses the tag instead of failing.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, reusing it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  dmg:
    needs: tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust-target: aarch64-apple-darwin
          - rust-target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The updater artifacts need the upstream signing key, which this repo
      # does not have, so they are turned off for these builds. The app is
      # ad-hoc signed; add the APPLE_* secrets to tauri-action's env to sign
      # and notarize it.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: "Terax ${{ needs.tag.outputs.tag }}"
          releaseBody: "Download the DMG for your Mac: aarch64 is Apple Silicon, x64 is Intel."
          releaseDraft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          args: >-
            --target ${{ matrix.rust-target }}
            --bundles dmg
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
