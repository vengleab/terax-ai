name: Fork CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fork seams are intact
        run: node scripts/fork/check-seams.mjs

  ssh-core:
    name: ssh-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ssh-core
      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy -p terax-ssh --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test -p terax-ssh --locked

  ssh-plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ssh-plugin
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -p tauri-plugin-terax-ssh --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test -p tauri-plugin-terax-ssh --locked

  launch-plugin:
    name: launch-plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: launch-plugin
      # The macOS run is the one that compiles the `open -a Terax <folder>` handler.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -p tauri-plugin-terax-launch --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test -p tauri-plugin-terax-launch --locked

  vscode-helper:
    name: vscode-helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./vscode-extension/helper -> target
      - name: Clippy
        working-directory: vscode-extension/helper
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: vscode-extension/helper
        run: cargo test --locked

  vscode-extension:
    name: vscode-extension (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./vscode-extension/helper -> target
      - run: pnpm install --frozen-lockfile
      - name: Type definitions for the extension host
        working-directory: vscode-extension
        run: npm ci --ignore-scripts
      - name: Type-check the page and the extension host
        run: |
          pnpm exec tsc -p vscode-extension/tsconfig.webview.json
          pnpm exec tsc -p vscode-extension/tsconfig.host.json --noEmit
      - name: Build the helper, so the tests can run it
        working-directory: vscode-extension/helper
        run: cargo build --locked
      - name: Unit tests
        run: pnpm exec vitest run vscode-extension
      - name: Package
        run: node vscode-extension/scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: terax-terminal-${{ matrix.target }}
          path: vscode-extension/*.vsix
          if-no-files-found: error

  ssh-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Module and fork tooling tests
        run: pnpm exec vitest run src/modules/ssh-transfer src/modules/launch-folders scripts/fork
